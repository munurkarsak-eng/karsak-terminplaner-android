name: Karsak Terminplaner APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Android-Projekt entpacken
        run: |
          unzip -o karsak-terminplaner-android-FIX17.zip
          ls -la
          ls -la karsak-terminplaner-android

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK bauen
        working-directory: karsak-terminplaner-android
        run: gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Karsak-Terminplaner-APK
          path: karsak-terminplaner-android/app/build/outputs/apk/debug/app-debug.apk
